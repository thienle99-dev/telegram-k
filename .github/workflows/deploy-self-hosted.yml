name: Deploy to self-hosted runner

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: self-hosted-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and push production image to GHCR
        env:
          REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ github.sha }}
          REGISTRY_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          registry_image="$(printf '%s' "$REGISTRY_IMAGE" | tr '[:upper:]' '[:lower:]')"
          image="$registry_image:$IMAGE_TAG"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          docker build -f .docker/Dockerfile_production -t "$image" -t "$registry_image:latest" .
          docker push "$image"
          docker push "$registry_image:latest"
          echo "TWEB_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Pull and run the versioned image
        run: |
          docker pull "$TWEB_IMAGE"
          TWEB_IMAGE="$TWEB_IMAGE" docker compose up -d --no-build --no-deps tweb.production

      - name: Verify production service
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/ > /dev/null; then
              echo "Production service is responding on http://127.0.0.1:8080/"
              exit 0
            fi
            sleep 2
          done
          docker compose ps tweb.production
          docker compose logs --tail=100 tweb.production
          exit 1
