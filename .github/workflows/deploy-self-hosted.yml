name: Build and push production image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: self-hosted-production-deploy
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: self-hosted
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and push production image to GHCR
        env:
          REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ github.sha }}
          REGISTRY_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          registry_image="$(printf '%s' "$REGISTRY_IMAGE" | tr '[:upper:]' '[:lower:]')"
          image="$registry_image:$IMAGE_TAG"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          export DOCKER_BUILDKIT=1
          docker build -f .docker/Dockerfile_production -t "$image" -t "$registry_image:latest" .
          docker push "$image"
          docker push "$registry_image:latest"
